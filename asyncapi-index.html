<!DOCTYPE html>
<html>
  <head>
    <title>Warm House Event Bus API</title>
    <link rel="stylesheet" href="https://unpkg.com/@asyncapi/react-component@1.0.0-next.47/styles/default.min.css">
  </head>
  <body>
    <div id="asyncapi"></div>
    <script src="https://unpkg.com/@asyncapi/react-component@1.0.0-next.47/browser/standalone/index.js"></script>
    <script>
      AsyncApiStandalone.render({
        schema: {
          url: './asyncapi.yaml',
          refParser: { mode: 'dereference' }
        },
        config: {
          show: {
            sidebar: true,
            info: true,
            operations: true,
            messages: true,
            servers: true,
            errors: true
          }
        }
      }, document.getElementById('asyncapi'));
    </script>
  </body>
</html>
