asyncapi: 2.6.0
info:
  title: Warm House Event Bus
  version: 1.0.0
  description: Описание событийной архитектуры для обмена данными между микросервисами.

servers:
  production:
    url: amqp://broker.warmhouse.internal:5672
    protocol: amqp
    description: RabbitMQ Cluster

channels:
  device/telemetry/ingested:
    publish:
      summary: Публикация новой телеметрии
      description: Device Gateway публикует это событие, когда получает данные от физического устройства.
      message:
        $ref: '#/components/messages/TelemetryEvent'
    subscribe:
      summary: Обработка телеметрии
      description: Scenario Service подписывается на это событие для проверки триггеров.
      message:
        $ref: '#/components/messages/TelemetryEvent'

  device/command/sent:
    subscribe:
      summary: Команда на исполнение
      description: Scenario Service публикует это событие, когда срабатывает правило автоматизации.
      message:
        $ref: '#/components/messages/CommandEvent'

components:
  messages:
    TelemetryEvent:
      name: TelemetryEvent
      title: Событие телеметрии
      payload:
        type: object
        properties:
          device_id:
            type: string
            format: uuid
          timestamp:
            type: string
            format: date-time
          metric_type:
            type: string
          value:
            type: number

    CommandEvent:
      name: CommandEvent
      title: Событие команды
      payload:
        type: object
        properties:
          target_device_id:
            type: string
            format: uuid
          command:
            type: object
          source:
            type: string
            example: "scenario-engine"
